name: Update agent handoff

on:
  push:
    branches: [master]
    paths-ignore:
      - update.md
      - .github/workflows/update-handoff.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-handoff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50
      - name: Refresh automatic handoff section
        shell: bash
        run: |
          set -euo pipefail
          SHA="$GITHUB_SHA"
          SHORT_SHA="$(git rev-parse --short "$SHA")"
          AUTHOR="$(git show -s --format='%an' "$SHA")"
          COMMIT_DATE="$(git show -s --format='%cI' "$SHA")"
          SUBJECT="$(git show -s --format='%s' "$SHA")"
          BEFORE="${{ github.event.before }}"
          BRANCH="${GITHUB_REF_NAME:-master}"
          if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            CHANGED="$(git diff --name-status "$BEFORE" "$SHA" || true)"
            STAT="$(git diff --stat "$BEFORE" "$SHA" || true)"
          else
            CHANGED="$(git show --format= --name-status "$SHA" || true)"
            STAT="$(git show --format= --stat "$SHA" || true)"
          fi
          RECENT="$(git log -30 --pretty=format:'%h | %cI | %an | %s' | grep -v 'docs: update handoff log' | head -20 || true)"
          cat > /tmp/handoff-block.md <<EOF
          <!-- AUTO-CHANGELOG:START -->
          ## Status \`$BRANCH\` terbaru — otomatis

          Terakhir disinkronkan oleh GitHub Actions.

          - Commit: \`$SHORT_SHA\`
          - Full SHA: \`$SHA\`
          - Waktu commit: \`$COMMIT_DATE\`
          - Author: $AUTHOR
          - Message: $SUBJECT

          ### File berubah pada push terbaru
          \`\`\`text
          ${CHANGED:-Tidak ada daftar file yang tersedia.}
          \`\`\`

          ### Diff stat
          \`\`\`text
          ${STAT:-Tidak ada diff stat yang tersedia.}
          \`\`\`

          ### Riwayat commit terbaru
          \`\`\`text
          ${RECENT:-Belum ada riwayat tambahan.}
          \`\`\`

          > Bagian ini otomatis. Keputusan arsitektur/produk tetap wajib diperbarui manual di bagian atas \`update.md\`.
          <!-- AUTO-CHANGELOG:END -->
          EOF
          python - <<'PY'
          from pathlib import Path
          import re
          path = Path('update.md')
          text = path.read_text()
          block = Path('/tmp/handoff-block.md').read_text().strip()
          updated, count = re.subn(r'<!-- AUTO-CHANGELOG:START -->.*?<!-- AUTO-CHANGELOG:END -->', block, text, flags=re.S)
          if count != 1:
              raise SystemExit('AUTO-CHANGELOG markers missing or duplicated in update.md')
          path.write_text(updated.rstrip() + '\n')
          PY
      - name: Commit handoff refresh
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "docs: update handoff log [skip ci]"
          git push
